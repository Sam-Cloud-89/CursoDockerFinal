name: proyecto_docker_final   # <--- ¡Aquí defines el nombre personalizado! Si no se pone esta linea cogera el nombre del directorio donde estamos

services:
  miNode: 
    build: .
    image: samcloud89/imagen_node:0.1
    container_name: contenedor_node
    ports:
      - "5000:3000"
    environment:
      - HOSTNAME=${HOSTNAME}          # Coge el hostname por defecto del sistema, antes que el mio
      - SALUDO=${SALUDO}
      - DB_HOST=${DB_HOST}            # <--- ¡Clave! Apunta al nombre del servicio MySQL
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE} # Pon el nombre de tu BD
      - DB_PORT=${DB_PORT}
    networks:
      - MIRED_PRIVADA
      - MIRED_PUBLICA
    depends_on:
      - miSQL

  miSQL:
    image: mysql:26.7
    container_name: ${DB_HOST}
    #ports:
    #  - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - datos_mysql:/var/lib/mysql
      - ./miScriptSQL:/docker-entrypoint-initdb.d
    networks:
      - MIRED_PRIVADA
volumes:
  datos_mysql:

networks:
  MIRED_PRIVADA:
    driver: bridge
  MIRED_PUBLICA:
    driver: bridge


